main_workflow:
  steps:
    - branch_package:
        source_project: home:PSuarezHernandez:tests:github
        source_package: fake-package
        target_project: home:PSuarezHernandez:tests:github:CI
  filters:
    event: pull_request

rebuild_master:
  steps:
    - trigger_services:
        project: home:PSuarezHernandez:tests:github
        package: fake-package
  filters:
    event: push
    branches:
      only:
        - openSUSE/devel/master-version-2
